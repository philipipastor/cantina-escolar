# Backup diário do banco de produção (Neon). O plano grátis do Neon só restaura as últimas 6 horas,
# então esta cópia é a garantia de poder voltar alguns dias. Restaurar: pg_restore --no-owner --no-privileges.
name: Backup do banco

on:
  schedule:
    # Todo dia às 03:00 no horário de Brasília (06:00 UTC), fora do horário das cantinas.
    - cron: "0 6 * * *"
  # Permite rodar na hora, pela aba Actions do GitHub.
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Copia o banco
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Cadastre o segredo BACKUP_DATABASE_URL no repositório." >&2
            exit 1
          fi
          name="cantina-$(date -u +%Y-%m-%d).dump"
          # pg_dump na mesma versão do Neon (17), em formato próprio do Postgres, já comprimido.
          docker run --rm -e DATABASE_URL -v "$PWD:/backup" postgres:17 \
            sh -c "pg_dump --format=custom --no-owner --no-privileges --dbname=\"\$DATABASE_URL\" --file=/backup/$name"
          ls -lh "$name"
          echo "BACKUP_FILE=$name" >> "$GITHUB_ENV"

      - name: Guarda a cópia por 30 dias
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
