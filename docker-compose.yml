services:
  postgres:
    image: postgres:17-alpine
    container_name: cantina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cantina
      POSTGRES_PASSWORD: cantina_dev
      POSTGRES_DB: cantina
    ports:
      # Porta 5433 na máquina para não conflitar com outro PostgreSQL local.
      # Publicada só em 127.0.0.1: o banco de desenvolvimento não fica exposto na rede.
      - "127.0.0.1:5433:5432"
    volumes:
      - cantina-postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cantina -d cantina"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cantina-postgres-data:
